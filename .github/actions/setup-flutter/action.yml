name: Setup Countora Flutter
description: Install the repository-approved Flutter toolchain with shared caching.

runs:
  using: composite
  steps:
    - name: Install Flutter 3.47.1
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.47.1'
        cache: true

    - name: Print Flutter toolchain
      shell: bash
      run: flutter --version
