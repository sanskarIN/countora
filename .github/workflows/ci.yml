name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runners
        run: dart run tool/bootstrap_platforms.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization source
        run: flutter gen-l10n

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check local documentation links
        run: dart run tool/check_markdown_links.dart

      - name: Build web
        run: flutter build web --release
