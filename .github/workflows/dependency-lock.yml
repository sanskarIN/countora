name: Dependency lock refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - pubspec.yaml
      - tool/bootstrap_platforms.dart
      - tool/src/root_file_guard.dart
      - .github/actions/setup-flutter/action.yml
      - .github/workflows/dependency-lock.yml

permissions:
  contents: write

concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    name: Refresh reviewed application lockfile
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install repository Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Verify localization source and catalogs
        run: dart run tool/check_localization_source.dart

      - name: Generate platform runners safely
        run: dart run tool/bootstrap_platforms.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated dependency lock
        run: dart run tool/check_dependency_lock.dart

      - name: Generate localization source
        run: flutter gen-l10n

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify required repository files
        run: dart run tool/check_required_files.dart

      - name: Verify version metadata
        run: dart run tool/check_version_sync.dart

      - name: Scan tracked source for obvious secrets
        run: dart run tool/check_secrets.dart

      - name: Check local documentation links
        run: dart run tool/check_markdown_links.dart

      - name: Verify patch hygiene
        run: git diff --check

      - name: Reject unexpected tracked bootstrap changes
        shell: bash
        run: |
          if ! git diff --quiet -- . ':(exclude)pubspec.lock'; then
            echo "Platform/bootstrap verification changed tracked files unexpectedly."
            git diff -- . ':(exclude)pubspec.lock'
            exit 1
          fi

      - name: Retain verified lockfile artifact
        uses: actions/upload-artifact@v7
        with:
          name: countora-pubspec-lock-${{ github.run_id }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Commit reviewed lockfile when changed
        shell: bash
        run: |
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock is already current."
            exit 0
          fi

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git commit -m "build: refresh dependency lock"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
