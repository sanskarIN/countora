name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runners
        run: dart run tool/bootstrap_platforms.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check documentation links
        run: dart run tool/check_markdown_links.dart

      - name: Build web release
        run: flutter build web --release

      - name: Build Android APK release
        run: flutter build apk --release

      - name: Archive web release
        run: cd build/web && zip -r ../countora-web.zip .

      - name: Publish GitHub release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/countora-web.zip
          generate_release_notes: true
