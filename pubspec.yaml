name: countora
description: A polished, local-first multi-countdown timer built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.2.0
  shared_preferences: 2.5.5
  timezone: 0.11.1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
