name: countora
description: A polished, local-first multi-countdown timer built with Flutter.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  intl: any
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

msix_config:
  display_name: Countora
  publisher_display_name: Sanskar
  identity_name: dev.sanskar.countora
  msix_version: 0.2.0.2
  output_path: build/windows/msix
  output_name: countora-windows-x64
  install_certificate: false

flutter:
  generate: true
  uses-material-design: true
